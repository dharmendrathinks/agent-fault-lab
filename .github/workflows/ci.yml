name: offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AFLAB_RUN_LIVE_TESTS: "0"
  AFLAB_LIVE_TEST_COMMAND: "0"

jobs:
  offline-suite:
    name: offline checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned project manager
        run: python -m pip install uv==0.11.32
      - name: Install exactly the locked dependencies
        run: uv sync --locked --all-groups
      - name: Run socket-blocked checks without fetching
        run: make check
      - name: Exercise the installed wheel outside the source tree
        run: make package-check
