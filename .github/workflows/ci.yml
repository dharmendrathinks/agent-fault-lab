name: offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AFLAB_RUN_LIVE_TESTS: "0"
  AFLAB_LIVE_TEST_COMMAND: "0"

jobs:
  offline-suite:
    name: offline checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned project manager
        run: python -m pip install uv==0.11.32
      - name: Install exactly the locked dependencies
        run: uv sync --locked --all-groups
      - name: Run socket-blocked checks without fetching
        run: make check
      - name: Measure offline branch coverage including inherited Python children
        run: make coverage
      - name: Exercise the installed wheel outside the source tree
        run: make package-check
      - name: Install the separately locked static scanner
        run: make scanner-setup
      - name: Exercise real static scanning and approval on this platform
        run: make scanner-check
      - name: Install the separately locked LangGraph runtime
        run: make runtime-setup
      - name: Exercise real graph execution with sockets blocked
        run: make runtime-check
      - name: Install the separately locked external reproduction
        run: make external-setup
      - name: Reproduce router recovery and controls with sockets blocked
        run: make external-check
