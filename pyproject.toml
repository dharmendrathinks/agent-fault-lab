[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-fault-lab"
version = "0.2.0rc1"
description = "Learn agent reliability through reproducible failures and tested safeguards."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
keywords = ["ai-agents", "evaluation", "fault-injection", "reliability"]
dependencies = [
    "httpx>=0.28,<0.29",
    "ollama>=0.6,<1",
    "pydantic>=2.10,<3",
]

[project.urls]
Repository = "https://github.com/dharmendrathinks/agent-fault-lab"
Issues = "https://github.com/dharmendrathinks/agent-fault-lab/issues"

[project.scripts]
aflab = "agent_fault_lab.cli:main"

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "mypy>=1.15,<2",
    "pytest>=9.0.3,<10",
    "pytest-socket>=0.7,<1",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fault_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."] # Test repository examples as well as the installed src package.
addopts = "--strict-config --strict-markers --disable-socket"
required_plugins = ["pytest-socket"]
filterwarnings = ["error"]
markers = ["live: explicit local Ollama test; never selected by default"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples", "scripts"]
